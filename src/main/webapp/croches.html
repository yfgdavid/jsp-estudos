<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de produtos</title>
</head>
<body>
    <form method="post" action="produto">
        <input type="hidden" name="acao" value="inserir">
        <p>
            <label for="codigo">Código: </label>
            <input type="number" name="codigo" id="codigo" size="50">
        </p>

        <p>
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" size="50">
        </p>

        <p>
            <label for="tipoLinha">Tipo da linha: </label>
            <input type="text" name="tipo" id="tipoLinha" size="50">
        </p>

        <p>
            <label for="preco">Preço: </label>
            <input type="number" step="0.5" name="preco" id="preco" size="50">
        </p>


        <p>
            <input type="submit" value="Cadastrar">
        </p>
    </form>
</body>
</html>
